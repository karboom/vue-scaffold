# SSG 产物的托管配置（deploy/Dockerfile 的 runtime-static 目标使用）。
# 设计目的：把"静态托管必须自己补的两件事"固化在镜像里，换环境不靠运维口口相传——
# 1) 深链回退：/login 这类路径在 CDN/nginx 上没有对应实体文件时要落到预渲染的 404.html，
#    由 Nuxt 的兜底页接管（静态形态的运行镜像用的就是这份 conf，本地要验证回退直接起它）；
# 2) 长缓存：产物文件名带内容 hash，/_nuxt/ 可以钉一年。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 已知路由命中各自目录下的 index.html；未知路径统一交 404.html（保留 404 状态码利于爬虫与监控）
    location / {
        try_files $uri $uri/ /404.html;
    }
}
